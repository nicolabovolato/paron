[package]
name = "paron-cli"
version = "0.1.0"
edition.workspace = true
license-file.workspace = true
publish.workspace = true
homepage.workspace = true
repository.workspace = true

[lib]
name = "paron_cli"
path = "src/lib.rs"

[[bin]]
name = "paron"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
paron-core = { workspace = true }
paron-tunnel-protocol = { workspace = true }

axum = { workspace = true }
base16ct = { workspace = true }
clap = { workspace = true }
clap-extra = { workspace = true }
cliclack = { workspace = true }
console = { workspace = true }
dialoguer = { workspace = true }
futures-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
ipnet = { workspace = true }
rand = { workspace = true }
rcgen = { workspace = true }
pem = { workspace = true }
rustix = { workspace = true }
rustls = { workspace = true }
rustls-acme = { workspace = true }
tokio-rustls = { workspace = true }
secrecy = { workspace = true }
tabled = { workspace = true }
zeroize = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
parking_lot = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
governor = { workspace = true }
tower_governor = { workspace = true }
forwarded-header-value = { workspace = true }
derive_more = { workspace = true }
tracing = { workspace = true }
js-frontend-embed = { workspace = true, features = ["serve"] }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
x509-parser = { workspace = true }
url = { workspace = true }
indoc = { workspace = true }
askama = { workspace = true }
sysinfo = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
tracing-journald = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
tracing-oslog = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-platform = { workspace = true }

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { workspace = true }
musl-nss-mdns = { workspace = true }

[build-dependencies]
paron-openapi = { workspace = true }
js-frontend-embed = { workspace = true, features = ["build"] }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }
tower = { workspace = true }
