regex = "1"
sha2 = "0.11.1"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "uuid",
    "macros",
    "migrate",
    "json",
] }
ssh-key = { version = "0.6", default-features = false, features = ["alloc", "ecdsa"] }
strum = { version = "0.28", features = ["derive"] }
subtle = "2.6.1"
syn = { version = "3.0", features = ["full", "extra-traits"] }
