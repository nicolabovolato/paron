[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license-file = "LICENSE"
publish = false
homepage = "https://paron.bovolato.dev"
repository = "https://github.com/nicolabovolato/paron"

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(disable_testcontainers)'] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

[workspace.dependencies]
clap-extra = { path = "crates/clap-extra" }
clap-extra-macros = { path = "crates/clap-extra-macros" }
js-frontend-embed = { path = "crates/js-frontend-embed" }
js-frontend-embed-macros = { path = "crates/js-frontend-embed-macros" }
musl-nss-mdns = { path = "crates/musl-nss-mdns" }
paron-core = { path = "crates/paron-core" }
paron-openapi = { path = "crates/paron-openapi" }
paron-tunnel-protocol = { path = "crates/paron-tunnel-protocol" }
serde-utoipa-validate = { path = "crates/serde-utoipa-validate" }
serde-utoipa-validate-macros = { path = "crates/serde-utoipa-validate-macros" }
windows-platform = { path = "crates/windows-platform" }

anyhow = "1.0.104"
libc = "0.2"
nix = { version = "0.31", default-features = false, features = ["user"] }
rustix = { version = "1.1", features = ["fs", "net", "process"] }
password-hash = { version = "0.6", default-features = false, features = [
    "phc",
] }
argon2 = { version = "0.6", default-features = false, features = [
    "alloc",
    "password-hash",
    "getrandom",
] }
askama = "0.16.1"
async-stream = "0.3"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "http2",
    "json",
    "query",
    "tokio",
    "ws",
] }
axum-extra = { version = "0.12", default-features = false, features = [
    "cookie",
] }
base64 = "0.23"
base16ct = { version = "1", features = ["alloc"] }
brotli = { version = "9", default-features = false, features = ["std"] }
chacha20poly1305 = "0.11.0"
ciborium = "0.2"
clap = { version = "4", features = ["derive", "env"] }
cliclack = "0.5.7"
console = "0.16.6"
cookie = { version = "0.18", default-features = false }
coset = "0.4"
dialoguer = { version = "0.12.0", default-features = false, features = ["password"] }
criterion = { version = "0.8.2", default-features = false, features = [
    "async_tokio",
] }
derive_more = { version = "2", features = ["deref", "from", "into", "try_into"] }
futures-core = "0.3"
futures-io = "0.3"
futures-util = { version = "0.3", default-features = false }
hmac = "0.13.0"
hkdf = "0.13.0"
http-body-util = "0.1"
hyper = { version = "1", default-features = false }
ipnet = "2.12"
hyper-util = { version = "0.1", features = [
    "client",
    "client-legacy",
    "http1",
    "http2",
    "server",
    "server-auto",
    "server-graceful",
    "service",
    "tokio",
] }
ignore = "0.4"
indoc = "2.0.8"
jiff = { version = "0.2", default-features = false, features = [
    "std",
    "serde",
] }
mockall = "0.15.0"
parking_lot = "0.13"
percent-encoding = "2"
proc-macro2 = "1.0"
psl = "2.1"
quinn = { version = "0.11", default-features = false, features = [
    "runtime-tokio",
    "rustls-ring",
] }
quote = "1.0"
rand = "0.10.3"
ring = "0.17"
rcgen = { version = "0.14.10", features = ["x509-parser"] }
passkey = { version = "0.6", features = ["rust-crypto"] }
passkey-types = { version = "0.6", features = ["serialize_bytes_as_base64_string"] }
pem = "4.0.0"
russh = { version = "0.65.0", default-features = false, features = [
    "ring",
    "flate2",
    "rsa",
] }
rust-embed = { version = "8.13", features = [
    "mime-guess",
    "interpolate-folder-path",
