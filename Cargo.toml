uuid = { version = "1", features = ["v7", "serde"] }
windows-service = "0.8.1"
windows-sys = "0.61"
webauthn-rs-proto = "0.6.2"
time = { version = "0.3", default-features = false, features = ["std", "macros"] }
x509-parser = "0.18.1"
yamux = "0.14"
zeroize = "1.9"
