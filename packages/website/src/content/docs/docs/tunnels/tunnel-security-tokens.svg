<svg xmlns="http://www.w3.org/2000/svg" class="paron-diagram" viewBox="0 0 852 500" role="img" aria-label="How machines sign in, in a common reverse tunnel and in Paron.">
  <style>
    /* In a page that defines the --sl-color-* variables, the diagram uses them. Opened alone, it uses the second value. */
    .paron-diagram {
      --d-bg: var(--sl-color-bg, #ffffff);
      --d-text: var(--sl-color-white, #17181c);
      --d-detail: var(--sl-color-gray-2, #454857);
      --d-line: var(--sl-color-gray-3, #6b6f85);
      --d-box: var(--sl-color-gray-6, #f0f1f5);
      --d-box-line: var(--sl-color-gray-4, #a3a7b8);
      --d-server: var(--sl-color-accent-low, #c7d2fe);
      --d-server-line: var(--sl-color-accent, #4f46e5);
      --d-tunnel: var(--sl-color-orange, #d97706);
      --d-tunnel-text: var(--sl-color-orange-high, #92400e);
      --d-refused: var(--sl-color-red, #dc2626);
      font-family: var(--sl-font, system-ui, sans-serif);
    }
    @media (prefers-color-scheme: dark) {
      .paron-diagram {
        --d-bg: var(--sl-color-bg, #17181c);
        --d-text: var(--sl-color-white, #ffffff);
        --d-detail: var(--sl-color-gray-2, #c0c2d0);
        --d-line: var(--sl-color-gray-3, #8f93a8);
        --d-box: var(--sl-color-gray-6, #24262e);
        --d-box-line: var(--sl-color-gray-4, #545868);
        --d-server: var(--sl-color-accent-low, #1e2a78);
        --d-server-line: var(--sl-color-accent, #6d7cff);
        --d-tunnel: var(--sl-color-orange, #f5a524);
        --d-tunnel-text: var(--sl-color-orange-high, #fcd58a);
        --d-refused: var(--sl-color-red, #f87171);
      }
    }
    .paron-diagram .bg { fill: var(--d-bg); }
    .paron-diagram text { text-anchor: middle; fill: var(--d-detail); font-size: 13px; }
    .paron-diagram .name { fill: var(--d-text); font-size: 15px; font-weight: 600; }
    .paron-diagram .box { fill: var(--d-box); stroke: var(--d-box-line); }
    .paron-diagram .server { fill: var(--d-server); stroke: var(--d-server-line); stroke-width: 1.5; }
    .paron-diagram .zone { fill: none; stroke: var(--d-box-line); stroke-dasharray: 4 4; }
    .paron-diagram .line { fill: none; stroke: var(--d-line); stroke-width: 1.5; }
    .paron-diagram .arrow { fill: var(--d-line); }
    .paron-diagram .line.tunnel { stroke: var(--d-tunnel); stroke-dasharray: 6 4; }
    .paron-diagram .arrow.tunnel { fill: var(--d-tunnel); }
    .paron-diagram .label.tunnel { fill: var(--d-tunnel-text); }
      .paron-diagram .start { text-anchor: start; }
    .paron-diagram .chip { fill: var(--d-bg); stroke: var(--d-tunnel); stroke-width: 1.5; }
    .paron-diagram .chip-name { fill: var(--d-text); font-weight: 600; }
    .paron-diagram .line.refused { stroke: var(--d-refused); stroke-dasharray: 2 4; }
    .paron-diagram .cross { fill: none; stroke: var(--d-refused); stroke-width: 2; }
    .paron-diagram .line.bad { stroke: var(--d-refused); }
    .paron-diagram .arrow.bad { fill: var(--d-refused); }
    .paron-diagram .label.bad { fill: var(--d-refused); }
    .paron-diagram .item { fill: var(--d-bg); stroke: var(--d-box-line); }
    .paron-diagram .item.hit { stroke: var(--d-refused); stroke-width: 1.5; }
    .paron-diagram .line.idle { stroke: var(--d-box-line); stroke-dasharray: 6 4; }
    .paron-diagram .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; fill: var(--d-text); }
    .paron-diagram .box.hit { stroke: var(--d-refused); stroke-width: 1.5; }
    .paron-diagram .chip-name.bad { fill: var(--d-refused); }
  </style>
  <defs>
    <marker id="paron-sec-tokens" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow" d="M0 0 10 5 0 10z"/>
    </marker>
    <marker id="paron-sec-tokens-tunnel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow tunnel" d="M0 0 10 5 0 10z"/>
    </marker>
    <marker id="paron-sec-tokens-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow bad" d="M0 0 10 5 0 10z"/>
    </marker>
  </defs>

  <rect class="bg" width="852" height="500"/>

  <text class="name start" x="20" y="30">A common reverse tunnel</text>

  <rect class="box" x="20" y="52" width="230" height="46" rx="10"/>
  <text class="chip-name start" x="36" y="80">Machine 1</text>
  <rect class="item" x="142" y="61" width="96" height="28" rx="6"/>
  <text class="mono" x="190" y="79">tok_9f2c</text>
  <rect class="box" x="20" y="108" width="230" height="46" rx="10"/>
  <text class="chip-name start" x="36" y="136">Machine 2</text>
  <rect class="item" x="142" y="117" width="96" height="28" rx="6"/>
  <text class="mono" x="190" y="135">tok_9f2c</text>
  <rect class="box hit" x="20" y="178" width="230" height="46" rx="10"/>
  <text class="chip-name bad start" x="36" y="206">Attacker</text>
  <rect class="item hit" x="142" y="187" width="96" height="28" rx="6"/>
  <text class="mono" x="190" y="205">tok_9f2c</text>

  <rect class="box" x="622" y="52" width="210" height="172" rx="10"/>
  <text class="name" x="727" y="126">Server</text>
  <text x="727" y="147">one shared token,</text>
  <text x="727" y="165">valid until you change it</text>

  <path class="line" d="M250 75H620" marker-end="url(#paron-sec-tokens)"/>
  <text x="435" y="65">sign in with the token</text>
  <path class="line" d="M250 131H620" marker-end="url(#paron-sec-tokens)"/>
  <path class="line bad" d="M250 201H620" marker-end="url(#paron-sec-tokens-bad)"/>
  <text class="label bad" x="435" y="191">a copy of the token: accepted as a machine</text>

  <path class="phase" d="M20 250H832"/>

  <text class="name start" x="20" y="294">Paron</text>

  <rect class="box" x="20" y="316" width="230" height="46" rx="10"/>
  <text class="chip-name start" x="36" y="344">Machine 1</text>
  <rect class="chip" x="142" y="325" width="96" height="28" rx="6"/>
  <text class="chip-name" x="190" y="344">own key</text>
  <rect class="box" x="20" y="372" width="230" height="46" rx="10"/>
  <text class="chip-name start" x="36" y="400">Machine 2</text>
  <rect class="chip" x="142" y="381" width="96" height="28" rx="6"/>
  <text class="chip-name" x="190" y="400">own key</text>
  <rect class="box hit" x="20" y="442" width="230" height="46" rx="10"/>
  <text class="chip-name bad start" x="36" y="470">Attacker</text>
  <rect class="item hit" x="142" y="451" width="96" height="28" rx="6"/>
  <text class="mono" x="190" y="469">used token</text>

  <rect class="box server" x="622" y="316" width="210" height="172" rx="10"/>
  <g fill="none" transform="translate(709 336) scale(0.375) translate(-2 -16)"><rect x="2" y="16" width="96" height="96" rx="22" fill="oklch(0.17 0.012 35)"/><g transform="translate(50 64) scale(0.88) translate(-50 -64)"><path transform="translate(50 100) scale(0.84 0.8) translate(-50 -100)" d="M3 100 L3.4 88.5 Q4 81.6 10.5 80 L37 72.6 L63 72.6 L89.5 80 Q96 81.6 96.6 88.5 L97 100 Z" fill="oklch(0.94 0.01 80)"></path><g transform="translate(0 7) translate(50 76) scale(0.88) translate(-50 -76)"><path d="M27 35 L27 53 C25.5 68 36 76 50 76 C64 76 74.5 68 73 53 L73 35 Z" fill="oklch(0.94 0.01 80)" stroke="oklch(0.17 0.01 45)" stroke-width="4" stroke-linejoin="round"></path><path d="M32.4 42.2 L47.8 45 L47 49.4 L32.8 46.4 Z" fill="oklch(0.17 0.01 45)"></path><path d="M67.6 42.2 L52.2 45 L53 49.4 L67.2 46.4 Z" fill="oklch(0.17 0.01 45)"></path><path d="M36 51.6 L45 51.6 M64 51.6 L55 51.6" stroke="oklch(0.17 0.01 45)" stroke-width="3.4" stroke-linecap="round"></path><path d="M43 65.6 Q50 64 57 65.8" stroke="oklch(0.17 0.01 45)" stroke-width="3.6" stroke-linecap="round"></path><g transform="translate(0 3.5)"><path d="M26 30 L30 14 C36 9.5 44 9 50 11 C56 9 64 9.5 70 14 L74 30 Z" fill="oklch(0.94 0.01 80)"></path><path d="M12 30 C20.5 42.5 79.5 42.5 88 30 C77.5 34.8 22.5 34.8 12 30 Z" fill="oklch(0.94 0.01 80)" stroke="oklch(0.17 0.01 45)" stroke-width="2.6" stroke-linejoin="round"></path></g></g></g></g>
  <text class="name" x="727" y="396">Paron server</text>
  <text x="727" y="417">single-use tokens,</text>
  <text x="727" y="435">scoped to one machine</text>

  <path class="line tunnel" d="M250 339H620" marker-end="url(#paron-sec-tokens-tunnel)"/>
  <text class="label tunnel" x="435" y="329">sign in with their own keys</text>
  <path class="line tunnel" d="M250 395H620" marker-end="url(#paron-sec-tokens-tunnel)"/>
  <path class="line refused" d="M250 465H588"/>
  <path class="cross" d="M596 458l14 14m0-14l-14 14"/>
  <text x="420" y="455">refused</text>
</svg>
