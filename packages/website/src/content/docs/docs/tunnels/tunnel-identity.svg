<svg xmlns="http://www.w3.org/2000/svg" class="paron-diagram" viewBox="0 0 852 766" role="img" aria-label="How the machine and the server identify each other, at setup and at each connection.">
  <style>
    /* In a page that defines the --sl-color-* variables, the diagram uses them. Opened alone, it uses the second value. */
    .paron-diagram {
      --d-bg: var(--sl-color-bg, #ffffff);
      --d-text: var(--sl-color-white, #17181c);
      --d-detail: var(--sl-color-gray-2, #454857);
      --d-line: var(--sl-color-gray-3, #6b6f85);
      --d-box: var(--sl-color-gray-6, #f0f1f5);
      --d-box-line: var(--sl-color-gray-4, #a3a7b8);
      --d-server: var(--sl-color-accent-low, #c7d2fe);
      --d-server-line: var(--sl-color-accent, #4f46e5);
      --d-tunnel: var(--sl-color-orange, #d97706);
      --d-tunnel-text: var(--sl-color-orange-high, #92400e);
      --d-refused: var(--sl-color-red, #dc2626);
      font-family: var(--sl-font, system-ui, sans-serif);
    }
    @media (prefers-color-scheme: dark) {
      .paron-diagram {
        --d-bg: var(--sl-color-bg, #17181c);
        --d-text: var(--sl-color-white, #ffffff);
        --d-detail: var(--sl-color-gray-2, #c0c2d0);
        --d-line: var(--sl-color-gray-3, #8f93a8);
        --d-box: var(--sl-color-gray-6, #24262e);
        --d-box-line: var(--sl-color-gray-4, #545868);
        --d-server: var(--sl-color-accent-low, #1e2a78);
        --d-server-line: var(--sl-color-accent, #6d7cff);
        --d-tunnel: var(--sl-color-orange, #f5a524);
        --d-tunnel-text: var(--sl-color-orange-high, #fcd58a);
        --d-refused: var(--sl-color-red, #f87171);
      }
    }
    .paron-diagram .bg { fill: var(--d-bg); }
    .paron-diagram text { text-anchor: middle; fill: var(--d-detail); font-size: 13px; }
    .paron-diagram .name { fill: var(--d-text); font-size: 15px; font-weight: 600; }
    .paron-diagram .box { fill: var(--d-box); stroke: var(--d-box-line); }
    .paron-diagram .server { fill: var(--d-server); stroke: var(--d-server-line); stroke-width: 1.5; }
    .paron-diagram .zone { fill: none; stroke: var(--d-box-line); stroke-dasharray: 4 4; }
    .paron-diagram .line { fill: none; stroke: var(--d-line); stroke-width: 1.5; }
    .paron-diagram .arrow { fill: var(--d-line); }
    .paron-diagram .line.tunnel { stroke: var(--d-tunnel); stroke-dasharray: 6 4; }
    .paron-diagram .arrow.tunnel { fill: var(--d-tunnel); }
    .paron-diagram .label.tunnel { fill: var(--d-tunnel-text); }
      .paron-diagram .start { text-anchor: start; }
    .paron-diagram .chip { fill: var(--d-bg); stroke: var(--d-tunnel); stroke-width: 1.5; }
    .paron-diagram .chip-name { fill: var(--d-text); font-weight: 600; }
    .paron-diagram .line.refused { stroke: var(--d-refused); stroke-dasharray: 2 4; }
    .paron-diagram .cross { fill: none; stroke: var(--d-refused); stroke-width: 2; }
    .paron-diagram .item { fill: var(--d-bg); stroke: var(--d-box-line); }
    .paron-diagram .line.carry { stroke-dasharray: 4 4; }
    .paron-diagram .icon { fill: none; stroke: var(--d-text); color: var(--d-text); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .paron-diagram .icon.small { stroke: var(--d-detail); color: var(--d-detail); }
    .paron-diagram .end { text-anchor: end; }
    .paron-diagram .life { fill: none; stroke: var(--d-box-line); stroke-width: 1.5; }
    .paron-diagram .phase { fill: none; stroke: var(--d-box-line); stroke-dasharray: 2 5; }
    .paron-diagram .icon.check { stroke: var(--d-tunnel); color: var(--d-tunnel); }
    .paron-diagram .check-text { fill: var(--d-text); }
  </style>
  <defs>
    <marker id="paron-identity-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow" d="M0 0 10 5 0 10z"/>
    </marker>
    <marker id="paron-identity-arrow-tunnel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow tunnel" d="M0 0 10 5 0 10z"/>
    </marker>
  </defs>

  <rect class="bg" width="852" height="766"/>

  <path class="life" d="M120 76V746"/>
  <path class="life" d="M732 76V746"/>

  <rect class="box server" x="20" y="20" width="200" height="56" rx="10"/>
  <g fill="none" transform="translate(44 33) scale(0.3125) translate(-2 -16)"><rect x="2" y="16" width="96" height="96" rx="22" fill="oklch(0.17 0.012 35)"/><g transform="translate(50 64) scale(0.88) translate(-50 -64)"><path transform="translate(50 100) scale(0.84 0.8) translate(-50 -100)" d="M3 100 L3.4 88.5 Q4 81.6 10.5 80 L37 72.6 L63 72.6 L89.5 80 Q96 81.6 96.6 88.5 L97 100 Z" fill="oklch(0.94 0.01 80)"></path><g transform="translate(0 7) translate(50 76) scale(0.88) translate(-50 -76)"><path d="M27 35 L27 53 C25.5 68 36 76 50 76 C64 76 74.5 68 73 53 L73 35 Z" fill="oklch(0.94 0.01 80)" stroke="oklch(0.17 0.01 45)" stroke-width="4" stroke-linejoin="round"></path><path d="M32.4 42.2 L47.8 45 L47 49.4 L32.8 46.4 Z" fill="oklch(0.17 0.01 45)"></path><path d="M67.6 42.2 L52.2 45 L53 49.4 L67.2 46.4 Z" fill="oklch(0.17 0.01 45)"></path><path d="M36 51.6 L45 51.6 M64 51.6 L55 51.6" stroke="oklch(0.17 0.01 45)" stroke-width="3.4" stroke-linecap="round"></path><path d="M43 65.6 Q50 64 57 65.8" stroke="oklch(0.17 0.01 45)" stroke-width="3.6" stroke-linecap="round"></path><g transform="translate(0 3.5)"><path d="M26 30 L30 14 C36 9.5 44 9 50 11 C56 9 64 9.5 70 14 L74 30 Z" fill="oklch(0.94 0.01 80)"></path><path d="M12 30 C20.5 42.5 79.5 42.5 88 30 C77.5 34.8 22.5 34.8 12 30 Z" fill="oklch(0.94 0.01 80)" stroke="oklch(0.17 0.01 45)" stroke-width="2.6" stroke-linejoin="round"></path></g></g></g></g>
  <text class="name start" x="86" y="53">Paron server</text>

  <rect class="box" x="632" y="20" width="200" height="56" rx="10"/>
  <text class="name" x="732" y="53">Machine</text>

  <path class="phase" d="M20 112H832"/>
  <rect class="bg" x="355" y="100" width="142" height="24"/>
  <text class="name" x="426" y="117">Setup, one time</text>
  <path class="line carry" d="M122 168H730" marker-end="url(#paron-identity-arrow)"/>
  <g class="icon small" transform="translate(300.15 140) scale(0.75)"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v2"/><path d="M13 17v2"/><path d="M13 11v2"/></g>
  <text class="start" x="326.15" y="154">1. You copy the token from the web UI</text>
  <path class="line" d="M730 218H122" marker-end="url(#paron-identity-arrow)"/>
  <g class="icon small" transform="translate(300.15 190) scale(0.75)"><path d="M12 22v-5"/><path d="M15 8V2"/><path d="M17 8a1 1 0 0 1 1 1v4a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1z"/><path d="M9 8V2"/></g>
  <text class="start" x="326.15" y="204">2. The machine connects to the server</text>
  <path class="line" d="M122 268H730" marker-end="url(#paron-identity-arrow)"/>
  <g class="icon small" transform="translate(306.25 240) scale(0.75)"><path d="M13 22h5a2 2 0 0 0 2-2V8a2.4 2.4 0 0 0-.706-1.706l-3.588-3.588A2.4 2.4 0 0 0 14 2H6a2 2 0 0 0-2 2v3.3"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="m7.69 16.479 1.29 4.88a.5.5 0 0 1-.698.591l-1.843-.849a1 1 0 0 0-.879.001l-1.846.85a.5.5 0 0 1-.692-.593l1.29-4.88"/><circle cx="6" cy="14" r="3"/></g>
  <text class="start" x="332.25" y="254">3. The server shows its certificate</text>
  <rect class="chip" x="404" y="286" width="428" height="34" rx="8"/>
  <g class="icon check" transform="translate(418 294) scale(0.75)"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></g>
  <text class="check-text start" x="444" y="308">4. The machine checks it against the fingerprint in the token</text>
  <path class="line" d="M730 372H122" marker-end="url(#paron-identity-arrow)"/>
  <g class="icon small" transform="translate(245.25 344) scale(0.75)"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" r=".5" fill="currentColor"/></g>
  <text class="start" x="271.25" y="358">5. The machine shows its public key and sends the secret</text>
  <rect class="chip" x="20" y="390" width="392" height="34" rx="8"/>
  <g class="icon check" transform="translate(34 398) scale(0.75)"><path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z"/><path d="m16 9-5.5 5.5L8 12"/></g>
  <text class="check-text start" x="60" y="412">6. The server checks the secret, then registers that key</text>

  <path class="phase" d="M20 464H832"/>
  <rect class="bg" x="309.5" y="452" width="233" height="24"/>
  <text class="name" x="426" y="469">Every connection after that</text>
  <path class="line" d="M730 520H122" marker-end="url(#paron-identity-arrow)"/>
  <g class="icon small" transform="translate(300.15 492) scale(0.75)"><path d="M12 22v-5"/><path d="M15 8V2"/><path d="M17 8a1 1 0 0 1 1 1v4a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1z"/><path d="M9 8V2"/></g>
  <text class="start" x="326.15" y="506">1. The machine connects to the server</text>
  <path class="line" d="M122 570H730" marker-end="url(#paron-identity-arrow)"/>
  <g class="icon small" transform="translate(306.25 542) scale(0.75)"><path d="M13 22h5a2 2 0 0 0 2-2V8a2.4 2.4 0 0 0-.706-1.706l-3.588-3.588A2.4 2.4 0 0 0 14 2H6a2 2 0 0 0-2 2v3.3"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="m7.69 16.479 1.29 4.88a.5.5 0 0 1-.698.591l-1.843-.849a1 1 0 0 0-.879.001l-1.846.85a.5.5 0 0 1-.692-.593l1.29-4.88"/><circle cx="6" cy="14" r="3"/></g>
  <text class="start" x="332.25" y="556">2. The server shows its certificate</text>
  <rect class="chip" x="416" y="588" width="416" height="34" rx="8"/>
  <g class="icon check" transform="translate(430 596) scale(0.75)"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></g>
  <text class="check-text start" x="456" y="610">3. The machine checks it against the fingerprint from setup</text>
  <path class="line" d="M730 674H122" marker-end="url(#paron-identity-arrow)"/>
  <g class="icon small" transform="translate(306.25 646) scale(0.75)"><path d="M13 19a4 4 0 00-8 0"/><path d="M16 10h2"/><path d="M16 14h2"/><circle cx="9" cy="12" r="3"/><rect x="2" y="5" width="20" height="14" rx="2"/></g>
  <text class="start" x="332.25" y="660">4. The machine shows its public key</text>
  <rect class="chip" x="20" y="692" width="361" height="34" rx="8"/>
  <g class="icon check" transform="translate(34 700) scale(0.75)"><path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z"/><path d="m16 9-5.5 5.5L8 12"/></g>
  <text class="check-text start" x="60" y="714">5. The server checks it against the registered key</text>
</svg>
